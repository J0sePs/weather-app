[project]
name = "app"
version = "0.1.0"
description = "Weather App API"
readme = "README.md"
authors = [
    { name = "Jose", email = "jose.pizarro@unas.edu.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
weather-backend = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
addopts = ["--cov=app", "--cov-report=term-missing", "--cov-report=xml", "--cov-fail-under=80"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*", "tests/*"]
